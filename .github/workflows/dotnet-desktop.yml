name: .NET Core CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore HRMS.slnx

    - name: Build Solution
      run: dotnet build HRMS.slnx --configuration Release --no-restore

    - name: Run Unit Tests
      run: dotnet test HRMS.slnx --configuration Release --no-build --verbosity normal
