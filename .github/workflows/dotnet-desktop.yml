# This workflow builds, tests, measures code coverage, and packages your 
# ASP.NET Core HRMS solution on both Debug and Release configurations.

name: .NET Core CI/CD & Code Coverage

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore HRMS.slnx

    - name: Build Solution (${{ matrix.configuration }})
      run: dotnet build HRMS.slnx --configuration ${{ matrix.configuration }} --no-restore

    - name: Run Unit Tests with Code Coverage
      run: |
        dotnet test HRMS.slnx --configuration ${{ matrix.configuration }} --no-build --verbosity normal `
          --collect:"XPlat Code Coverage" `
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

    - name: Publish Web App (${{ matrix.configuration }})
      if: matrix.configuration == 'Release'
      run: dotnet publish HRMS/HRMS.Web.csproj --configuration Release --output ./publish-output

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: HRMS-Publish-${{ matrix.configuration }}
        path: ./publish-output
